name: ContinuousIntegration
on: push

defaults:
  run:
    shell: pwsh

jobs:
  Test:
    runs-on: windows-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
      - name: Set up Lix
        uses: lix-pm/setup-lix@2.0.0
      - name: Set up HashLink
        uses: CedX/SetupHashLink@v2026
        with:
          version: latest
      - name: Install dependencies
        run: lix download
      - name: Run tests
        run: haxe Test.hxml
