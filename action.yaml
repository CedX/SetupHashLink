author: Cédric Belin
name: Setup HashLink VM
description: Set up your GitHub Actions workflow with a specific version of the HashLink VM.

branding:
  color: purple
  icon: download

inputs:
  version:
    description: The version constraint of the HashLink VM.
    default: Latest
    required: false

runs:
  using: composite
  steps:
    - run: |
        Invoke-WebRequest "https://aka.ms/install-powershell.ps1" -OutFile Install-PowerShell.ps1
        ./Install-PowerShell.ps1
        Add-Content $Env:GITHUB_PATH "$Env:LOCALAPPDATA\Microsoft\powershell"
      shell: pwsh
    - run: Add-Content $Env:GITHUB_PATH ${{github.action_path}}
      shell: pwsh
    - run: Action.ps1
      shell: pwsh
      env:
        SETUP_HASHLINK_VERSION: ${{inputs.version}}
