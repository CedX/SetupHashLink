name: ContinuousIntegration
on: push

defaults:
  run:
    shell: pwsh

jobs:
  Test:
    runs-on: windows-latest
    steps:
      - name: Fetch sources
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 11
      - name: Set up PowerShell
        run: |
          Invoke-WebRequest "https://aka.ms/install-powershell.ps1" -OutFile Install-PowerShell.ps1
          ./Install-PowerShell.ps1
          Add-Content $Env:GITHUB_PATH "$Env:LOCALAPPDATA\Microsoft\powershell"
      - name: Install dependencies
        run: ./Invoke.ps1 Install
      - name: Run tests
        run: ./Invoke.ps1 Test
  Invoke:
    needs: test
    runs-on: windows-latest
    steps:
      - name: Set up HashLink
        uses: CedX/SetupHashLink@main
      - run: hl --version
